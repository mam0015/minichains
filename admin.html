<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fff6fa" />
  <meta name="robots" content="noindex,nofollow" />
  <title>MiniChains — Staff</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="MiniChains home"><img src="assets/images/mini-logo.png" alt="MiniChains" /></a>
    <span class="admin-header-title">Staff Dashboard</span>
    <button class="btn btn-ghost" id="adminLogoutBtn" hidden>Log out</button>
  </header>

  <main class="admin-main">
    <section class="admin-login-card" id="adminLoginCard">
      <p class="eyebrow">STAFF ONLY</p>
      <h1>Staff login</h1>
      <p>Enter the staff PIN to view orders, stock, loyalty and demand data.</p>
      <div class="staff-pin-row">
        <input id="adminPinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="····">
        <button class="btn btn-primary" id="adminPinSubmit" type="button">Log in</button>
      </div>
      <small class="staff-pin-error" id="adminPinError" hidden>Incorrect PIN — try again.</small>
    </section>

    <section class="admin-dashboard" id="adminDashboard" hidden>
      <nav class="admin-tabs" id="adminTabs">
        <button class="active" data-view="overview">Overview</button>
        <button data-view="products">Inventory</button>
        <button data-view="orders">Orders</button>
        <button data-view="loyalty">Loyalty</button>
        <button data-view="promotions">Promotions</button>
        <button data-view="restock">Restock Requests</button>
        <button data-view="analytics">Analytics</button>
        <button data-view="auctions">Auctions</button>
      </nav>

      <div class="admin-panel" id="adminPanel">
        <p class="admin-loading" id="adminLoading">Loading…</p>
        <div id="adminContent"></div>
      </div>
    </section>
  </main>

  <script src="square-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
